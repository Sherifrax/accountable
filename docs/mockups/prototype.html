<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="mockup-base.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  /* Clickable prototype of the MVP. Follows docs/spec.md. Data lives in this browser only. */
  body { background: var(--page); min-width: 1280px; }
  .shell { display: flex; min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .nav a:not(.active):hover { background: rgba(205,216,219,.1); text-decoration: none; }
  .side-foot { margin-top: auto; padding: 0 10px; font-size: 12px; line-height: 18px; color: var(--sea-mist); }
  .side-foot p { margin: 0 0 8px; opacity: .8; }
  .side-foot button { background: rgba(205,216,219,.12); color: var(--sea-mist); border: 0; border-radius: var(--radius-control);
    padding: 7px 10px; font: 500 12px var(--font-sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .side-foot button:hover { background: rgba(205,216,219,.2); }
  .main { max-width: 1504px; }
  a { color: var(--cerulean-ink); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--cerulean); outline-offset: 2px; }
  .btn-danger { background: var(--raspberry); color: #fff; }
  .btn-ghost:hover { background: var(--hover); color: var(--ink); }
  .btn-ghost.danger:hover { color: var(--raspberry-ink); }
  .btn-secondary:hover { background: var(--hover); }
  .btn-primary:hover { filter: brightness(.96); }

  /* Dashboard */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
  .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  .tile .figure { font: 500 32px/40px var(--font-mono); margin: 8px 0 4px; letter-spacing: -.01em; }
  .tile .context { font-size: 13px; color: var(--ink-muted); }
  .up { color: var(--sea-green-ink); } .down { color: var(--raspberry-ink); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { font: 11px var(--font-mono); fill: var(--ink-faint); }
  .grid-line { stroke: var(--divider); stroke-width: 1; }
  .fu { display: grid; grid-template-columns: 18px 1fr; gap: 4px 12px; padding: 11px 0; align-items: start; }
  .fu + .fu { border-top: 1px solid var(--divider); }
  .fu .title { font-weight: 500; }
  .fu .meta { grid-column: 2; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); }
  .fu-group { font: 500 12px/16px var(--font-sans); color: var(--ink-faint); margin: 6px 0 2px; }
  .funnel { display: grid; gap: 8px; }
  .funnel-row { display: grid; grid-template-columns: 96px 1fr 104px; align-items: center; gap: 12px; }
  .funnel-bar-wrap { display: flex; justify-content: center; }
  .funnel-bar { height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 500 13px var(--font-mono); }
  .funnel-kept { text-align: right; font-size: 12px; color: var(--ink-muted); }
  .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; margin: 10px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .mono { color: var(--ink); }
  .sub-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--divider); }
  .acts { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
  .act { display: grid; grid-template-columns: 32px 1fr; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--divider); }
  .act:nth-child(-n+2) { border-top: 0; }
  .badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; grid-row: span 2;
    background: var(--panel-sunken); color: var(--ink-muted); }
  .badge svg.lucide { width: 15px; height: 15px; }
  .meta { font-size: 12px; color: var(--ink-muted); }
  .empty-note { color: var(--ink-muted); padding: 12px 0; }

  /* Pipeline */
  .totals { display: flex; gap: 28px; align-items: center; margin-left: auto; margin-right: 8px; }
  .totals div { text-align: right; }
  .totals .mono { font: 500 20px/26px var(--font-mono); display: block; }
  .board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
  .col { width: 280px; flex: none; border-radius: var(--radius-panel); padding: 12px; min-height: calc(100vh - 150px); display: flex; flex-direction: column; }
  .col.over { box-shadow: inset 0 0 0 2px rgba(61,107,122,.25); }
  .col-head { padding: 4px 4px 12px; }
  .col-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .col-name .count { font: 500 12px var(--font-mono); color: var(--ink-muted); background: rgba(255,255,255,.7); padding: 1px 7px; border-radius: 999px; }
  .col-name .btn-ghost { margin-left: auto; }
  .col-sums { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--ink-muted); }
  .col-sums .mono { color: var(--ink); font-size: 13px; }
  .cards { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; max-height: calc(100vh - 250px); padding: 2px; min-height: 80px; }
  .card { background: #fff; border-radius: 10px; box-shadow: var(--shadow-panel); padding: 12px 14px; cursor: grab; flex: none; }
  .card:hover { box-shadow: 0 2px 4px rgba(7,59,76,.06), 0 6px 18px rgba(7,59,76,.09); }
  .card.dragging { opacity: .35; }
  .card .name { font-weight: 600; }
  .card .org { color: var(--ink-muted); font-size: 13px; }
  .card .contact { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); margin-top: 8px; }
  .card .contact svg.lucide { width: 13px; height: 13px; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .card .value { font: 500 14px var(--font-mono); }
  .card .date { font: 12px var(--font-mono); color: var(--ink-muted); padding: 2px 6px; border-radius: 6px; }
  .card.late .date { background: rgba(239,71,111,.14); color: var(--raspberry-ink); }
  .slot { height: 96px; border-radius: 10px; border: 2px dashed rgba(61,107,122,.45); flex: none; }
  .col-empty { font-size: 12px; color: var(--ink-faint); text-align: center; padding: 16px 0; }

  /* Tables */
  .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .search { position: relative; width: 320px; }
  .search svg.lucide { position: absolute; left: 11px; top: 10px; color: var(--ink-faint); }
  .search input { padding-left: 34px !important; }
  input, select, textarea { background: var(--panel-sunken); border: 0; box-shadow: inset 0 0 0 1px var(--divider);
    border-radius: var(--radius-control); font: 14px var(--font-sans); color: var(--ink); height: 36px; padding: 0 10px; width: 100%; }
  textarea { height: 84px; padding: 8px 10px; resize: vertical; }
  .seg { display: inline-flex; background: var(--panel-sunken); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 999px; font: 500 13px var(--font-sans);
    color: var(--ink-muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-panel); }
  .seg .n { font: 12px var(--font-mono); color: var(--ink-faint); }
  .count-note { margin-left: auto; font-size: 12px; color: var(--ink-muted); }
  table.dt { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: auto; }
  .dt th { background: var(--panel-sunken); text-align: left; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); padding: 0; height: 36px; white-space: nowrap; }
  .dt th:first-child { border-radius: 8px 0 0 8px; } .dt th:last-child { border-radius: 0 8px 8px 0; }
  .dt th button { all: unset; display: flex; align-items: center; gap: 4px; padding: 0 12px; height: 36px; cursor: pointer; width: 100%; box-sizing: border-box; }
  .dt th button:hover { color: var(--ink); }
  .dt th button:focus-visible { outline: 2px solid var(--cerulean); }
  .dt th.num button { justify-content: flex-end; }
  .dt th svg.lucide { width: 13px; height: 13px; }
  .dt td { height: 44px; padding: 0 12px; border-bottom: 1px solid var(--divider); white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .dt td.num { text-align: right; font-family: var(--font-mono); font-size: 13px; }
  .dt td.strong { font-weight: 600; }
  .dt tbody tr { cursor: pointer; }
  .dt tbody tr:hover td { background: var(--hover); }
  .row-acts { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; }
  tr:hover .row-acts, tr:focus-within .row-acts { opacity: 1; }
  .empty { padding: 40px 0 !important; text-align: center; color: var(--ink-muted); cursor: default; }
  .tag-lead { background: rgba(247,140,107,.2); color: var(--coral-ink); }
  .tag-qualified { background: rgba(255,193,69,.24); color: var(--marigold-ink); }
  .tag-customer { background: rgba(6,214,160,.18); color: var(--sea-green-ink); }
  .date-cell { display: inline-flex; gap: 8px; align-items: center; }

  /* Record pages */
  .crumb { font-size: 13px; margin-bottom: 4px; display: inline-flex; align-items: center; gap: 4px; }
  .crumb svg.lucide { width: 14px; height: 14px; }
  .rec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .facts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .head-acts { display: flex; gap: 8px; }
  .rec-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 16px; align-items: start; }
  .stack-col { display: grid; gap: 16px; }
  dl.details { display: grid; grid-template-columns: 130px 1fr; gap: 12px 16px; margin: 0; }
  dl.details dt { color: var(--ink-muted); font-size: 13px; }
  dl.details dd { margin: 0; overflow-wrap: anywhere; }
  .list-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--divider); gap: 12px; }
  .list-row:first-child { border-top: 0; }
  .list-row .sub { font-size: 12px; color: var(--ink-muted); }
  .figs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .figs .mono { font: 500 22px/30px var(--font-mono); display: block; margin-top: 4px; }
  .tl-item { display: grid; grid-template-columns: 32px 1fr auto; gap: 2px 12px; padding: 14px 0; border-top: 1px solid var(--divider); }
  .tl-item:first-child { border-top: 0; }
  .tl-item .text { font-weight: 500; }
  .tl-item .meta { grid-column: 2; }
  .tl-item .tl-acts { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 2px; opacity: 0; }
  .tl-item:hover .tl-acts, .tl-item:focus-within .tl-acts { opacity: 1; }
  .fu-line { grid-column: 2; display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--ink-muted); }
  .checkbox { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border-radius: 5px; background: var(--panel-sunken);
    box-shadow: inset 0 0 0 1.5px var(--ink-faint); cursor: pointer; display: grid; place-items: center; margin: 0; flex: none; padding: 0; }
  .checkbox:checked { background: var(--sea-green); box-shadow: none; }
  .checkbox:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--midnight); border-width: 0 2px 2px 0; transform: translate(0, -1px) rotate(45deg); }
  .done-text { text-decoration: line-through; color: var(--ink-muted); }

  /* Dialogs */
  dialog { border: 0; padding: 0; border-radius: 16px; width: 520px; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lift); color: var(--ink); }
  dialog::backdrop { background: rgba(7,59,76,.35); }
  .dlg-head { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
  .dlg-body { padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field { display: grid; gap: 6px; grid-column: span 2; align-content: start; }
  .field.half { grid-column: span 1; }
  .field label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
  .field .err { color: var(--raspberry-ink); font-size: 12px; min-height: 0; }
  .field.invalid input, .field.invalid textarea { box-shadow: inset 0 0 0 1.5px var(--raspberry); }
  .field .hint { font-size: 12px; color: var(--ink-faint); }
  .check-field { display: flex; align-items: center; gap: 8px; grid-column: span 2; font-size: 14px; }
  .dlg-foot { padding: 0 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }
  .dlg-text { padding: 12px 24px 20px; margin: 0; }

  /* Toasts */
  #toasts { position: fixed; right: 24px; bottom: 24px; display: grid; gap: 8px; z-index: 50; }
  .toast-item { background: #fff; border-radius: 10px; box-shadow: var(--shadow-lift); padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-weight: 500; animation: tin .18s ease-out; }
  .toast-item svg.lucide { color: var(--sea-green-ink); }
  @keyframes tin { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script>

const STAGES = [

  { key: "qualified", name: "Qualified", prob: 25, color: "var(--stage-qualified)", on: "var(--midnight)", tint: "rgba(255,193,69,.09)" },
  { key: "proposal", name: "Proposal", prob: 50, color: "var(--stage-proposal)", on: "var(--midnight)", tint: "rgba(247,140,107,.07)" },

const ST = Object.fromEntries(STAGES.map(s => [s.key, s]));

// ---------- Dates, money, text ----------
const pad = n => String(n).padStart(2, "0");
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const todayIso = () => isoD(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayDiff = s => Math.round((parseD(s) - TODAY) / 864e5);
const nowLocal = () => { const d = new Date(); return `${isoD(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD = s => s ? parseD(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—";
const fmtDT = s => { const d = new Date(s); return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) + ", " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); };
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const short = n => n >= 1e6 ? "$" + (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? "$" + Math.round(n / 1e3) + "K" : money(n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rel = s => { const n = dayDiff(s); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n > 1 ? `in ${n} days` : n === -1 ? "1 day overdue" : `${-n} days overdue`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const $ = s => document.querySelector(s);
const icons = () => { try { lucide.createIcons(); } catch (e) { /* icons are optional */ } };

function seed() {
  const S = { orgs: [], contacts: [], deals: [], acts: [], next: 1 };
  const id = () => S.next++;
  const at = (off, h, m = 0) => `${isoD(addDays(TODAY, off))}T${pad(h)}:${pad(m)}`;
  ORGS.forEach(([name, industry, website, notes]) => S.orgs.push({ id: id(), name, industry, website, notes }));
  CONTACTS.forEach(([name, title, oi, status], i) => {
    const org = oi == null ? null : S.orgs[oi];
    const [first, ...rest] = name.toLowerCase().replace(/'/g, "").split(" ");
    S.contacts.push({ id: id(), name, title, status, orgId: org ? org.id : null,
      email: `${first}.${rest.join("")}@${org ? org.website : "mailbox.example"}`, phone: `+1 555-01${pad(10 + (i * 37) % 90)}` });
  });
  const posCount = {};
  DEALS.forEach(([name, ci, stage, value, closeOff, reach], i) => {
    const c = S.contacts[ci];
    const d = { id: id(), name, contactId: c.id, orgId: c.orgId, stage, value, prob: ST[stage].prob,
      close: isoD(addDays(TODAY, closeOff)), pos: posCount[stage] = (posCount[stage] ?? -1) + 1 };
    S.deals.push(d);
    const path = stage === "won" ? LADDER : stage === "lost" ? [...OPEN.slice(0, OPEN.indexOf(reach) + 1), "lost"] : OPEN.slice(0, OPEN.indexOf(stage) + 1);
    const lastOff = OPEN.includes(stage) ? -(2 + (i * 7) % 20) : closeOff;
    for (let k = path.length - 1, off = lastOff; k >= 1; k--, off -= 9 + (i + k) % 8) {
      S.acts.push({ id: id(), type: "stage", dealId: d.id, contactId: c.id, from: path[k - 1], to: path[k],
        desc: `Moved from ${ST[path[k - 1]].name} to ${ST[path[k]].name}`, at: at(off, 9 + (i + k) % 8, (i * 13) % 60), followUp: null, done: false });
    }
    if (!OPEN.includes(stage) && closeOff < -30) {
      const [type, desc] = stage === "won" ? [["call", "Agreed the final price"], ["email", "Sent the final proposal"]][i % 2]
        : [["note", "Chose another supplier on price"], ["call", "Budget moved to next year"]][i % 2];
      S.acts.push({ id: id(), type, dealId: d.id, contactId: c.id, desc, at: at(closeOff - 3, 11), followUp: null, done: false });
    }
  });
  ACTS.forEach(([type, ci, dealName, desc, off, h, fu, done]) => {
    const d = dealName ? S.deals.find(x => x.name === dealName) : null;
    S.acts.push({ id: id(), type, desc, dealId: d ? d.id : null, contactId: d ? d.contactId : S.contacts[ci].id,
      at: at(off, h, (off * -17) % 60), followUp: fu == null ? null : isoD(addDays(TODAY, fu)), done: !!done });
  });
  return S;
}

const org = id => S.orgs.find(o => o.id === id);
const contact = id => S.contacts.find(c => c.id === id);
const deal = id => S.deals.find(d => d.id === id);
const isOpen = d => OPEN.includes(d.stage);
const isLate = d => isOpen(d) && d.close && d.close < todayIso();
const expected = d => d.value * d.prob / 100;
const byPos = (a, b) => a.pos - b.pos;
const newest = (a, b) => b.at.localeCompare(a.at);
const column = stage => S.deals.filter(d => d.stage === stage).sort(byPos);
const renumber = stage => column(stage).forEach((d, i) => d.pos = i);

function changeStage(d, to, prob) {
  if (d.stage === to) return false;
  const from = d.stage;
  d.stage = to;
  d.prob = prob ?? ST[to].prob;
  if (to === "won" || to === "lost") d.close = todayIso();
  S.acts.push({ id: S.next++, type: "stage", dealId: d.id, contactId: d.contactId, from, to,
    desc: `Moved from ${ST[from].name} to ${ST[to].name}`, at: nowLocal(), followUp: null, done: false });
  return true;
}
function moveDeal(id, to, index, prob) {
  const d = deal(id), from = d.stage;
  const col = S.deals.filter(x => x.stage === to && x.id !== id).sort(byPos);
  col.splice(Math.max(0, Math.min(index, col.length)), 0, d);
  const changed = changeStage(d, to, prob);
  col.forEach((x, i) => x.pos = i);
  if (from !== to) renumber(from);
  save();
  return changed;
}

const dealImpact = d => ({ gone: S.acts.filter(a => a.dealId === d.id && (a.type === "stage" || !a.contactId)).length,
  kept: S.acts.filter(a => a.dealId === d.id && a.type !== "stage" && a.contactId).length });
function deleteOrg(o) {
  S.contacts.forEach(c => { if (c.orgId === o.id) c.orgId = null; });
  S.deals.forEach(d => { if (d.orgId === o.id) d.orgId = null; });
  S.orgs = S.orgs.filter(x => x !== o);
}
function deleteContact(c) {
  S.deals.forEach(d => { if (d.contactId === c.id) d.contactId = null; });
  S.acts = S.acts.filter(a => !(a.contactId === c.id && !a.dealId));
  S.acts.forEach(a => { if (a.contactId === c.id) a.contactId = null; });
  S.contacts = S.contacts.filter(x => x !== c);
}
function deleteDeal(d) {
  S.acts = S.acts.filter(a => !(a.dealId === d.id && (a.type === "stage" || !a.contactId)));
  S.acts.forEach(a => { if (a.dealId === d.id) a.dealId = null; });
  S.deals = S.deals.filter(x => x !== d);
  renumber(d.stage);
}

function timeline(acts, ctx) {
  if (!acts.length) return `<p class="empty-note">Nothing logged yet.</p>`;

    let fu = "";

  const reached = S.deals.map(d => [d, reach(d)]);

function viewPipeline() {

  const card = d => `<div class="card ${isLate(d) ? "late" : ""}" draggable="true" data-id="${d.id}" data-href="#/deals/${d.id}" tabindex="0" aria-label="${esc(d.name)}">

    <div class="foot"><span class="value">${money(d.value)}</span><span class="date">${fmtD(d.close)}</span></div></div>`;
  const html = `
    <div class="page-head"><h1 class="page-title">Pipeline</h1>
      <div class="totals"><div><span class="label">Open pipeline</span><span class="mono">${money(open.reduce((a, d) => a + d.value, 0))}</span></div>
        <div><span class="label">Expected revenue</span><span class="mono">${money(open.reduce((a, d) => a + expected(d), 0))}</span></div></div>
      <button class="btn btn-primary" data-action="new-deal"><i data-lucide="plus"></i>New deal</button></div>
    <div class="board" id="board">${STAGES.map(s => { const col = column(s.key);
      return `<section class="col" style="background:${s.tint}" data-stage="${s.key}" aria-label="${s.name}">
        <div class="col-head"><div class="col-name"><i class="dot" style="background:${s.color}"></i>${s.name}<span class="count">${col.length}</span>
          <button class="btn btn-ghost" data-action="new-deal" data-stage="${s.key}" title="New deal in ${s.name}" aria-label="New deal in ${s.name}"><i data-lucide="plus"></i></button></div>
          <div class="col-sums"><span>Total <span class="mono">${money(col.reduce((a, d) => a + d.value, 0))}</span></span>
            <span>Expected <span class="mono">${money(col.reduce((a, d) => a + expected(d), 0))}</span></span></div></div>
        <div class="cards">${col.map(card).join("") || `<div class="col-empty">Drop a deal here</div>`}</div></section>`; }).join("")}</div>`;
  const after = () => {
    let dragId = null;
    const clearSlots = () => { document.querySelectorAll(".slot").forEach(s => s.remove()); document.querySelectorAll(".col.over").forEach(c => c.classList.remove("over")); };
    const indexAt = (list, cy) => { const cards = [...list.querySelectorAll(".card:not(.dragging)")];
      const i = cards.findIndex(c => { const r = c.getBoundingClientRect(); return cy < r.top + r.height / 2; }); return [i < 0 ? cards.length : i, cards]; };
    document.querySelectorAll(".card").forEach(c => {
      c.addEventListener("dragstart", e => { dragId = +c.dataset.id; e.dataTransfer.setData("text/plain", c.dataset.id); e.dataTransfer.effectAllowed = "move"; requestAnimationFrame(() => c.classList.add("dragging")); });
      c.addEventListener("dragend", () => { c.classList.remove("dragging"); clearSlots(); });
    });
    document.querySelectorAll(".col").forEach(colEl => {
      const list = colEl.querySelector(".cards");
      colEl.addEventListener("dragover", e => {
        if (dragId == null) return;
        e.preventDefault();
        const [i, cards] = indexAt(list, e.clientY);
        const slot = document.querySelector(".slot") || Object.assign(document.createElement("div"), { className: "slot" });
        document.querySelectorAll(".col.over").forEach(c => c !== colEl && c.classList.remove("over")); colEl.classList.add("over");
        const emptyNote = list.querySelector(".col-empty"); if (emptyNote) emptyNote.style.display = "none";
        if (cards[i]) { if (slot.nextSibling !== cards[i]) list.insertBefore(slot, cards[i]); } else if (list.lastElementChild !== slot) list.appendChild(slot);
      });
      colEl.addEventListener("drop", e => {
        e.preventDefault();
        if (dragId == null) return;
        const [i] = indexAt(list, e.clientY), id = dragId; dragId = null;
        const before = deal(id).stage, changed = moveDeal(id, colEl.dataset.stage, i);
        route();
        toast(changed ? `Moved to ${ST[colEl.dataset.stage].name}` : "Order saved");
        if (changed && before !== colEl.dataset.stage && (colEl.dataset.stage === "won" || colEl.dataset.stage === "lost")) toast("Close date set to today");
      });
    });
  };
  return { html, after };
}

function tableRows(name) {
  const t = TABLES[name], st = TS[name], q = st.q.trim().toLowerCase();

  if (q) rows = rows.filter(r => t.cols.some(c => String(c.text ? c.text(r) : c.val(r) ?? "").toLowerCase().includes(q)));
  const col = t.cols.find(c => c.key === st.key);
  return [...rows].sort((a, b) => { const x = col.val(a), y = col.val(b);
    if (x === "" || x == null) return 1; if (y === "" || y == null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * st.dir; });

const opt = (v, l, sel) => `<option value="${esc(v)}" ${String(sel ?? "") === String(v) ? "selected" : ""}>${esc(l)}</option>`;
function fieldHtml(f, v) {

  return `<div class="field ${f.half ? "half" : ""}" data-field="${f.name}"><label for="${id}">${f.label}${req}</label>${input}${f.hint ? `<span class="hint">${f.hint}</span>` : ""}<span class="err"></span></div>`;

function readForm(form, fields) {
  const v = {};
  fields.forEach(f => { const el = form.elements[f.name]; if (!el) return;
    if (f.type === "checkbox") v[f.name] = el.checked;
    else if (f.type === "number") v[f.name] = el.value.trim() === "" ? null : Number(el.value);
    else if (f.ref) v[f.name] = el.value ? Number(el.value) : null;

  return v;
}
function validate(fields, v) {

  fields.forEach(f => { const x = v[f.name];
    if (f.required && (x == null || x === "")) e[f.name] = `${f.label} is required`;
    else if (f.type === "email" && x && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)) e[f.name] = "Enter an email like name@company.com";
    else if (f.type === "number" && x != null && (!Number.isInteger(x) || x < (f.min ?? 0) || (f.max != null && x > f.max)))
      e[f.name] = f.max != null ? `Enter a whole number from ${f.min ?? 0} to ${f.max}` : "Enter a whole number, 0 or more"; });
  return e;
}
function openForm({ title, fields, values = {}, submit = "Save", onSubmit, onChange }) {
  dlg.innerHTML = `<form novalidate><div class="dlg-head"><h2 class="section-title" id="dlg-title">${esc(title)}</h2>
      <button type="button" class="btn btn-ghost" data-close aria-label="Close"><i data-lucide="x"></i></button></div>
    <div class="dlg-body">${fields.map(f => fieldHtml(f, values[f.name])).join("")}</div>
    <div class="dlg-foot"><button type="button" class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" type="submit">${esc(submit)}</button></div></form>`;
  const form = dlg.querySelector("form");
  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = readForm(form, fields), errs = validate(fields, v);
    form.querySelectorAll(".field").forEach(el => { const m = errs[el.dataset.field]; el.classList.toggle("invalid", !!m); el.querySelector(".err").textContent = m || ""; });
    if (Object.keys(errs).length) { form.querySelector(".invalid input, .invalid textarea, .invalid select")?.focus(); return; }
    const msg = onSubmit(v);
    dlg.close(); save(); route(); if (msg) toast(msg);
  });
  if (onChange) form.addEventListener("change", e => onChange(form, e.target.name));
  icons(); dlg.showModal();
  form.querySelector("input:not([type=checkbox]), select, textarea")?.focus();
}
function openConfirm({ title, body, label, onConfirm }) {
  dlg.innerHTML = `<div class="dlg-head"><h2 class="section-title" id="dlg-title">${esc(title)}</h2></div><p class="dlg-text">${body}</p>
    <div class="dlg-foot"><button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-danger" id="ok">${esc(label)}</button></div>`;
  $("#ok").addEventListener("click", () => { const msg = onConfirm(); dlg.close(); save(); route(); toast(msg); });
  dlg.showModal(); dlg.querySelector("[data-close]").focus();
}
dlg.addEventListener("click", e => { if (e.target === dlg || e.target.closest("[data-close]")) dlg.close(); });

// Forms
const orgOptions = () => [["", "None"], ...[...S.orgs].sort((a, b) => a.name.localeCompare(b.name)).map(o => [o.id, o.name])];
const contactOptions = orgId => [["", "None"], ...S.contacts.filter(c => !orgId || c.orgId === orgId).sort((a, b) => a.name.localeCompare(b.name)).map(c => [c.id, c.name])];

function orgForm(o) {
  openForm({ title: o ? "Edit organization" : "New organization", submit: o ? "Save" : "Add organization", values: o ?? {},
    fields: [{ name: "name", label: "Name", required: true }, { name: "website", label: "Website", half: true, hint: "For example acme.com" },
      { name: "industry", label: "Industry", half: true }, { name: "notes", label: "Notes", type: "textarea" }],
    onSubmit: v => { if (o) { Object.assign(o, v); return "Organization saved"; }
      const n = { id: S.next++, ...v }; S.orgs.push(n); location.hash = `#/organizations/${n.id}`; return "Organization added"; } });
}
function contactForm(c, preset = {}) {
  openForm({ title: c ? "Edit contact" : "New contact", submit: c ? "Save" : "Add contact", values: c ?? { status: "lead", ...preset },
    fields: [{ name: "name", label: "Name", required: true }, { name: "email", label: "Email", type: "email", half: true },
      { name: "phone", label: "Phone", half: true }, { name: "title", label: "Job title", half: true },
      { name: "orgId", label: "Organization", type: "select", ref: true, half: true, options: orgOptions() },
      { name: "status", label: "Status", type: "select", options: STATUSES }],
    onSubmit: v => { if (c) { Object.assign(c, v); return "Contact saved"; }
      const n = { id: S.next++, ...v }; S.contacts.push(n); if (!preset.orgId) location.hash = `#/contacts/${n.id}`; return "Contact added"; } });
}
function dealForm(d, preset = {}) {
  const values = d ? { ...d } : { stage: "new", prob: ST[preset.stage || "new"].prob, ...preset };
  openForm({ title: d ? "Edit deal" : preset.stage ? `New deal in ${ST[preset.stage].name}` : "New deal", submit: d ? "Save" : "Add deal", values,
    fields: [{ name: "name", label: "Name", required: true },
      { name: "orgId", label: "Organization", type: "select", ref: true, half: true, options: orgOptions() },
      { name: "contactId", label: "Main contact", type: "select", ref: true, half: true, options: contactOptions(values.orgId) },
      { name: "stage", label: "Stage", type: "select", half: true, options: STAGES.map(s => [s.key, s.name]) },
      { name: "value", label: "Value (US dollars)", type: "number", required: true, half: true },
      { name: "prob", label: "Probability of close (%)", type: "number", max: 100, half: true, hint: "Changes with the stage" },
      { name: "close", label: "Close date", type: "date", half: true }],
    onChange: (form, name) => {
      if (name === "stage") form.elements.prob.value = ST[form.elements.stage.value].prob;
      if (name === "orgId") { const oid = form.elements.orgId.value ? +form.elements.orgId.value : null, sel = form.elements.contactId.value;
        form.elements.contactId.innerHTML = contactOptions(oid).map(([v, l]) => opt(v, l, sel)).join(""); }
      if (name === "contactId" && !form.elements.orgId.value) { const c = contact(+form.elements.contactId.value);
        if (c?.orgId) form.elements.orgId.value = c.orgId; }
    },
    onSubmit: v => {
      if (v.prob == null) v.prob = ST[v.stage].prob;
      if (!v.close) v.close = null;
      if (d) {
        const { stage, prob, ...rest } = v; Object.assign(d, rest);
        if (stage !== d.stage) moveDeal(d.id, stage, 0, prob); else d.prob = prob;
        return "Deal saved";
      }
      S.deals.filter(x => x.stage === v.stage).forEach(x => x.pos++);
      const n = { id: S.next++, ...v, pos: 0 };
      if (v.stage === "won" || v.stage === "lost") n.close = n.close || todayIso();
      S.deals.push(n);
      if (!preset.stage && !preset.orgId && !preset.contactId) location.hash = `#/deals/${n.id}`;
      return "Deal added";
    } });
}
function actForm(a, ctx = {}) {
  const fields = [{ name: "type", label: "Type", type: "select", half: true, options: TYPES },
    { name: "at", label: "Date and time", type: "datetime", required: true, half: true },
    { name: "desc", label: "Description", type: "textarea", required: true }];
  if (!a && ctx.contactId) fields.push({ name: "dealId", label: "Deal", type: "select", ref: true, options: [["", "None"], ...S.deals.filter(d => d.contactId === ctx.contactId).map(d => [d.id, d.name])] });
  fields.push({ name: "followUp", label: "Follow-up date", type: "date", half: true, hint: "Optional. Shows on the dashboard until done." });
  if (a) fields.push({ name: "done", label: "Follow-up done", type: "checkbox" });
  openForm({ title: a ? "Edit activity" : "Log activity", submit: a ? "Save" : "Log activity", values: a ?? { type: "note", at: nowLocal() }, fields,
    onSubmit: v => {
      v.followUp = v.followUp || null;
      if (a) { Object.assign(a, v); if (!a.followUp) a.done = false; return "Activity saved"; }
      const dl = ctx.dealId ? deal(ctx.dealId) : null;
      S.acts.push({ id: S.next++, ...v, done: false, dealId: dl ? dl.id : v.dealId ?? null, contactId: dl ? dl.contactId : ctx.contactId });
      return v.followUp ? "Activity logged with a follow-up" : "Activity logged";
    } });
}

// ---------- Actions ----------
const ACTIONS = {
  "new-org": () => orgForm(),
  "edit-org": ds => orgForm(org(+ds.id)),
  "del-org": ds => { const o = org(+ds.id), n = orgImpact(o);
    openConfirm({ title: `Delete ${o.name}?`, label: "Delete organization",
      body: `${n.contacts || n.deals ? `Its ${plural(n.contacts, "contact")} and ${plural(n.deals, "deal")} will be kept, with no organization.` : "Nothing else is linked to it."} This can't be undone.`,
      onConfirm: () => { deleteOrg(o); if (location.hash.startsWith("#/organizations/")) location.hash = "#/organizations"; return "Organization deleted"; } }); },
  "new-contact": ds => contactForm(null, ds.org ? { orgId: +ds.org } : {}),
  "edit-contact": ds => contactForm(contact(+ds.id)),
  "del-contact": ds => { const c = contact(+ds.id), n = contactImpact(c), parts = [];
    if (n.deals) parts.push(`Their ${plural(n.deals, "deal")} will be kept, with no main contact.`);
    if (n.gone) parts.push(`${plural(n.gone, "activity").replace("activitys", "activities")} linked only to them will be deleted.`);
    if (n.kept) parts.push(`${plural(n.kept, "activity").replace("activitys", "activities")} also linked to a deal will stay with the deal.`);
    openConfirm({ title: `Delete ${c.name}?`, label: "Delete contact", body: `${parts.join(" ") || "Nothing else is linked to them."} This can't be undone.`,
      onConfirm: () => { deleteContact(c); if (location.hash.startsWith("#/contacts/")) location.hash = "#/contacts"; return "Contact deleted"; } }); },
  "new-deal": ds => dealForm(null, { ...(ds.stage ? { stage: ds.stage, prob: ST[ds.stage].prob } : {}), ...(ds.org ? { orgId: +ds.org } : {}), ...(ds.contact ? { contactId: +ds.contact } : {}) }),
  "edit-deal": ds => dealForm(deal(+ds.id)),
  "del-deal": ds => { const d = deal(+ds.id), n = dealImpact(d), parts = [];
    if (n.gone) parts.push(`Its ${n.gone} timeline ${n.gone === 1 ? "entry" : "entries"} will be deleted.`);
    if (n.kept) parts.push(`${plural(n.kept, "activity").replace("activitys", "activities")} also linked to a contact will stay with the contact.`);
    openConfirm({ title: `Delete ${d.name}?`, label: "Delete deal", body: `${parts.join(" ") || "Nothing else is linked to it."} This can't be undone.`,
      onConfirm: () => { deleteDeal(d); if (location.hash.startsWith("#/deals/")) location.hash = "#/deals"; return "Deal deleted"; } }); },
  "set-stage": ds => { const d = deal(+ds.id); if (d.stage === ds.stage) return; moveDeal(d.id, ds.stage, 0); route();
    toast(`Moved to ${ST[ds.stage].name}${ds.stage === "won" || ds.stage === "lost" ? ". Close date set to today" : ""}`); },
  "log": ds => actForm(null, { dealId: ds.deal ? +ds.deal : null, contactId: ds.contact ? +ds.contact : null }),
  "edit-act": ds => actForm(S.acts.find(a => a.id === +ds.id)),
  "del-act": ds => { const a = S.acts.find(x => x.id === +ds.id);
    openConfirm({ title: "Delete this activity?", label: "Delete activity", body: `“${esc(a.desc)}” will be removed from every timeline. This can't be undone.`,
      onConfirm: () => { S.acts = S.acts.filter(x => x !== a); return "Activity deleted"; } }); },
  "sort": ds => { const st = TS[CUR]; if (st.key === ds.key) st.dir *= -1; else { st.key = ds.key; st.dir = 1; } route(); },
  "filter": ds => { TS.contacts.status = ds.status; route(); },
  "reset": () => openConfirm({ title: "Reset to sample data?", label: "Reset data",
    body: "Every change you've made in this prototype will be replaced by the sample data. This can't be undone.",
    onConfirm: () => { S = seed(); return "Sample data restored"; } }),
};

document.addEventListener("click", e => {
  const a = e.target.closest("[data-action]");
  if (a) { e.preventDefault(); e.stopPropagation(); ACTIONS[a.dataset.action]?.(a.dataset); return; }
  if (e.target.closest("a, input, button, label")) return;
  const row = e.target.closest("[data-href]");
  if (row) location.hash = row.dataset.href;
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("[data-href]")) location.hash = e.target.dataset.href;
});
document.addEventListener("input", e => {
  if (e.target.id === "q" && CUR) { TS[CUR].q = e.target.value; $("#tb").innerHTML = tableBody(CUR); updateCount(CUR); icons(); }
});
document.addEventListener("change", e => {
  const id = e.target.dataset?.toggle;
  if (!id) return;
  const a = S.acts.find(x => x.id === +id); a.done = e.target.checked; save();
  toast(a.done ? "Follow-up marked done" : "Follow-up reopened");
  setTimeout(route, 250);
});

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast-item"; el.innerHTML = `<i data-lucide="circle-check"></i>${esc(msg)}`;
  $("#toasts").appendChild(el); icons();
  setTimeout(() => el.remove(), 2600);
}

// ---------- Router ----------
function route() {
  const [sec = "dashboard", rawId] = location.hash.replace(/^#\/?/, "").split("/");
  const section = ["dashboard", "pipeline", "deals", "organizations", "contacts"].includes(sec) ? sec : "dashboard";
  const id = rawId ? Number(rawId) : null;
  CUR = null;
  renderSidebar(section);
  let v;
  if (id && section === "organizations") v = viewOrg(id);
  else if (id && section === "contacts") v = viewContact(id);
  else if (id && section === "deals") v = viewDeal(id);
  else if (section === "pipeline") v = viewPipeline();
  else if (["deals", "organizations", "contacts"].includes(section)) v = viewTable(section);
  else v = viewDashboard();
  $("#main").innerHTML = v.html;
  icons();
  v.after?.();
  const titles = { dashboard: "Dashboard", pipeline: "Pipeline", deals: "Deals", organizations: "Organizations", contacts: "Contacts" };
  document.title = `${titles[section]} · Accountable`;
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
route();
</script>
